name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI is not a demo machine. Pin the profile so no test can reach a public
  # inference endpoint even if a credential is present in the environment.
  START_PROFILE: airgapped

jobs:
  # The zero-dependency guarantee. If this job needs an install step, the
  # guarantee has been broken — that is the whole point of running it first.
  stdlib-core:
    name: risk + attestation core with nothing installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Import the core with no dependencies present
        run: |
          cd src
          python -c "
          import start
          from start.risk import RiskObject, synthesise_plan, stripe_ids
          from start.attestation import build_seal, verify_seal, attest_narrative_invariance
          from start.runtime_profile import profile_banner
          plan = synthesise_plan(stripe_id='credit', obj=RiskObject(object_id='X', kind='scorecard'))
          assert plan.plan_hash()
          assert len(stripe_ids()) >= 10
          print('stdlib core OK —', profile_banner())
          "
      - name: Installer dry-run must work offline
        run: python scripts/bootstrap.py --dry-run --profile minimal

  packaging:
    name: packaging contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: requirements.txt is in sync with pyproject.toml
        run: python scripts/sync_requirements.py --check
      - run: pytest tests/test_packaging_contract.py -v

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dl,trees,tuning,xai,formats,llm,dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy || true   # advisory until annotations stabilise
      - name: Tests
        run: pytest
      - name: Compile all sources
        run: python -m compileall -q src scripts
      - name: CLI smoke test
        run: |
          start doctor
          start list-tests
          start risk stripes
      - name: Demo flight (no provider, no network)
        run: python scripts/demo_flight.py --speed 0 --no-clear

  no-secrets:
    name: no credentials or organisation identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed credentials
        run: |
          set +e
          # Deliberately excludes .env.example, which contains only blank keys.
          matches=$(grep -rEn "sk-[A-Za-z0-9]{20,}|(api[_-]?key|password|secret)[[:space:]]*=[[:space:]]*[\"'][A-Za-z0-9_-]{16,}" \
            --include="*.py" --include="*.md" --include="*.yaml" --include="*.yml" \
            --include="*.toml" --include="*.txt" --include="*.ipynb" . )
          if [ -n "$matches" ]; then
            echo "Possible credential committed:"; echo "$matches"; exit 1
          fi
          echo "no credentials found"
      - name: Refuse committed environments and outputs
        run: |
          set +e
          bad=$(git ls-files | grep -E "^(\.venv|venv|\.env$|start_output/|dist/|build/)" )
          if [ -n "$bad" ]; then echo "Must not be tracked:"; echo "$bad"; exit 1; fi
          echo "working tree clean of environments and artefacts"
