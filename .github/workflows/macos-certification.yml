name: macos-certification

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  START_PROFILE: airgapped
  START_DEVICE: cpu
  OMP_NUM_THREADS: "1"
  KMP_DUPLICATE_LIB_OK: "TRUE"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  macos-cert:
    name: macOS certification (macos-latest, py3.12.13)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Cache macOS Python 3.12.13 toolcache
        id: cache-macos-python
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/Python/3.12.13
          key: macos-toolcache-python-3.12.13-${{ runner.arch }}

      - name: Provision Python 3.12.13 toolcache on macOS
        if: steps.cache-macos-python.outputs.cache-hit != 'true'
        run: |
          brew install pyenv
          pyenv install 3.12.13
          PY_DIR="$(pyenv root)/versions/3.12.13"
          ARCH=$(uname -m)
          TC_DIR="${RUNNER_TOOL_CACHE}/Python/3.12.13/${ARCH}"
          mkdir -p "$TC_DIR"
          cp -a "$PY_DIR/"* "$TC_DIR/"
          [ -f "$TC_DIR/bin/python3.12" ] && [ ! -f "$TC_DIR/bin/python" ] && ln -sf "$TC_DIR/bin/python3.12" "$TC_DIR/bin/python"
          [ -f "$TC_DIR/bin/python3" ] && [ ! -f "$TC_DIR/bin/python" ] && ln -sf "$TC_DIR/bin/python3" "$TC_DIR/bin/python"
          touch "${RUNNER_TOOL_CACHE}/Python/3.12.13/${ARCH}.complete"

      - name: Install macOS runtime dependencies
        run: |
          brew install libomp

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Assert exact certified Python 3.12.13
        run: |
          python -c "import sys; print('Python version:', sys.version); assert sys.version_info[:3] == (3, 12, 13), f'Expected (3, 12, 13), got {sys.version_info[:3]}'"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dl,trees,tuning,xai,formats,llm,orchestration,web,telemetry,dev]"
      - name: pip check
        run: pip check || true
      - name: Tests
        run: pytest tests/
      - name: CLI smoke test
        run: |
          start doctor
          start list-tests
          start risk stripes
      - name: Demo flight (no provider, no network)
        run: python scripts/demo_flight.py --speed 0 --no-clear
