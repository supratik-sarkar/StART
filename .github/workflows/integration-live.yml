name: integration-live

# Manual only. No test currently carries the `integration` marker and no provider
# secrets are wired into this job, so a scheduled run selected zero tests and
# pytest exited 5 every week. Re-add a schedule only once both exist.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  START_PROFILE: live
  START_DEVICE: cpu
  START_DISABLE_MPS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  live-integration:
    name: live provider & connector integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Assert exact certified Python 3.12.13
        run: |
          python -c "import sys; print('Python version:', sys.version); assert sys.version_info[:3] == (3, 12, 13), f'Expected (3, 12, 13), got {sys.version_info[:3]}'"
      - name: Install full suite with connectors
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[everything,dev]" -c constraints.txt
      - name: Run live integration tests
        run: |
          set +e
          pytest -m "integration"
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::error::No test carries the integration marker; nothing was exercised."
          fi
          exit $rc
