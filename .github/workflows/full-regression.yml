name: full-regression

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  START_PROFILE: airgapped
  START_DEVICE: cpu
  START_DISABLE_MPS: "1"
  OMP_NUM_THREADS: "1"
  KMP_DUPLICATE_LIB_OK: "TRUE"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  full-regression:
    name: full regression (ubuntu-latest, py3.12.13)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Assert exact certified Python 3.12.13
        run: |
          python -c "import sys; print('Python version:', sys.version); assert sys.version_info[:3] == (3, 12, 13), f'Expected (3, 12, 13), got {sys.version_info[:3]}'"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dl,trees,tuning,xai,formats,llm,orchestration,web,telemetry,dev]"
      - name: pip check
        run: pip check || true
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy || true
      - name: Compile all sources
        run: python -m compileall -q src scripts
      - name: Full test suite
        run: pytest tests/
      - name: CLI smoke test
        run: |
          start doctor
          start list-tests
          start risk stripes
      - name: Demo flight (no provider, no network)
        run: python scripts/demo_flight.py --speed 0 --no-clear
