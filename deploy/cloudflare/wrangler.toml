name = "start-mrt-gateway"
main = "worker.js"
compatibility_date = "2024-09-01"

# Route static assets directly to Cloudflare Static Assets (bypasses worker execution to preserve free-tier quota)
[assets]
directory = "../../web/dist"
binding = "ASSETS"

# Environment variables
[vars]
ORACLE_ORIGIN_URL = "https://oracle-origin.start-mrt.org"
ENVIRONMENT = "production"
