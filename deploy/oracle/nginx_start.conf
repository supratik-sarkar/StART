server {
    listen 80;
    server_name 137.23.61.219.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 137.23.61.219.sslip.io;

    ssl_certificate /etc/letsencrypt/live/137.23.61.219.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/137.23.61.219.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Pinned WebLLM Model Static Asset Mirror
    location /webllm-models/ {
        alias /opt/start/static/webllm-models/;
        autoindex off;

        # Strict Origin CORS for StART Cloudflare Worker Gateway
        add_header Access-Control-Allow-Origin "https://start-mrt-gateway.sapman.workers.dev" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://start-mrt-gateway.sapman.workers.dev" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Prevent access to hidden or dot files
        location ~ /\. {
            deny all;
            return 404;
        }
    }

    # 2. Dynamic StART Backend API Proxy (Local Uvicorn 127.0.0.1:8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
